<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Price Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 10px; }
        th { background-color: #f2f2f2; }
        a { text-decoration: none; padding: 10px 20px; background-color: #28a745; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Amazon Price Tracker</h1>
    <a href="/update">🔄 Update Prices</a>
    <table>
        <tr>
            <th>Timestamp</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Amazon Link</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product['Timestamp'] }}</td>
            <td>{{ product['Product Name'] }}</td>
            <td>${{ product['Price'] }}</td>
            <td><a href="{{ product['URL'] }}" target="_blank">View on Amazon</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
